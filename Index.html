<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pomodoro Timer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="timer-card">
      <p class="eyebrow">Focus Session</p>

      <p
        id="timeDisplay"
        class="time-display"
        role="timer"
        aria-live="off"
      >
        25:00
      </p>

      <div class="controls">
        <button
          id="startPauseBtn"
          class="btn btn-primary"
          type="button"
        >
          Start
        </button>

        <button
          id="resetBtn"
          class="btn btn-secondary"
          type="button"
        >
          Reset
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
