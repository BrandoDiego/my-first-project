<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Space+Grotesk:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="timer-card">
    <p class="eyebrow" id="modeLabel">Focus Session</p>

    <div class="ring-wrap">
      <svg class="progress-ring" viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90" />
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90" />
      </svg>
      <h1 class="time-display" id="timeDisplay">25:00</h1>
    </div>

    <div class="controls">
      <button id="startPauseBtn" class="btn btn-primary">Start</button>
      <button id="resetBtn" class="btn btn-secondary">Reset</button>
    </div>

    <p class="session-count" id="sessionCount">Sessions completed: 0</p>

    <button
      id="settingsToggle"
      class="settings-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="settingsPanel"
    >
      Settings
    </button>

    <div class="settings-panel" id="settingsPanel" hidden>
      <label class="settings-field">
        Work (min)
        <input type="number" id="workInput" min="1" max="90" value="25" />
      </label>
      <label class="settings-field">
        Break (min)
        <input type="number" id="breakInput" min="1" max="30" value="5" />
      </label>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
